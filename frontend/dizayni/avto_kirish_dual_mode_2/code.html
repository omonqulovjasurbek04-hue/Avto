<body class="bg-surface text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center p-md overflow-hidden relative">
<!-- Blurred Ambient Background for Light Mode -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-10%] left-[-5%] w-[60%] h-[60%] bg-primary-fixed/40 rounded-full blur-[120px] mix-blend-multiply opacity-70"></div>
<div class="absolute bottom-[-15%] right-[-10%] w-[70%] h-[70%] bg-secondary-fixed/50 rounded-full blur-[140px] mix-blend-multiply opacity-60"></div>
<div class="absolute top-[30%] right-[15%] w-[40%] h-[40%] bg-tertiary-fixed/30 rounded-full blur-[100px] mix-blend-multiply opacity-50"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[420px] flex flex-col items-center">
<!-- Central Glassmorphism Card -->
<div class="w-full bg-surface-container-lowest/70 backdrop-blur-md rounded-[18px] border border-outline-variant/30 shadow-[0_8px_32px_rgba(103,80,164,0.06)] p-lg flex flex-col gap-lg">
<!-- Branding & Header -->
<div class="flex flex-col items-center gap-sm">
<div class="w-[64px] h-[64px] rounded-[16px] bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<div class="text-center">
<h1 class="font-h2 text-h2 text-primary tracking-tighter mb-xs">AVTO YHQ</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tizimga xush kelibsiz</p>
</div>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md w-full" method="POST">
<!-- Email / Username Input -->
<div class="flex flex-col gap-xs group">
<label class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors">Email / Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors px-xs">person</span>
<input class="w-full bg-transparent border-b border-outline-variant py-sm pl-[36px] pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-b-2 focus:border-primary transition-all placeholder:text-outline-variant/50" placeholder="Kiriting..." required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs group">
<label class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors">Parol</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors px-xs">lock</span>
<input class="w-full bg-transparent border-b border-outline-variant py-sm pl-[36px] pr-[40px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-b-2 focus:border-primary transition-all placeholder:text-outline-variant/50" id="password-input" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 text-outline-variant hover:text-primary transition-colors px-xs flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Form Utilities -->
<div class="flex justify-between items-center mt-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 rounded border border-outline-variant group-hover:border-primary transition-colors bg-surface-container-lowest">
<input class="absolute opacity-0 w-full h-full cursor-pointer peer" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Eslab qolish</span>
</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed-dim transition-colors font-semibold" href="#">Parolni unutdingizmi?</a>
</div>
<!-- Primary Action -->
<button class="mt-sm w-full bg-primary text-on-primary font-hud-data text-hud-data py-sm rounded-lg shadow-[0_4px_14px_rgba(0,88,190,0.25)] hover:shadow-[0_6px_20px_rgba(0,88,190,0.4)] active:scale-[0.98] transition-all duration-200 uppercase tracking-wider flex items-center justify-center gap-sm group" type="submit">
<span>Kirish</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

<div class="h-px bg-outline-variant/30 flex-1"></div>

                Akkauntingiz yo'qmi?

</div>

<p class="font-label-caps text-label-caps text-outline-variant/70">

            </p>

<script>
        // Simple password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
