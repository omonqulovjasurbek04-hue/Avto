<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .hud-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        
        .hud-border {
            position: relative;
        }
        
        .hud-border::before,
        .hud-border::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: theme('colors.secondary');
            border-style: solid;
        }
        
        .hud-border::before {
            top: 0;
            left: 0;
            border-width: 2px 0 0 2px;
        }
        
        .hud-border::after {
            bottom: 0;
            right: 0;
            border-width: 0 2px 2px 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col md:hidden">
<!-- Scenario Player Canvas -->
<div class="relative w-full aspect-[4/3] bg-surface-container-lowest">
<!-- Placeholder for simulation visual -->
<img class="absolute inset-0 w-full h-full object-cover opacity-80" data-alt="A first-person view from inside a car approaching an intersection in a rainy cyberpunk city at night. Neon signs reflect on the wet windshield. The dashboard is visible in the lower foreground. The style is hyper-realistic 3D rendering with deep blues, cyan neon, and high contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKlTDJjaQ0kC9kJdRaENHvg1aatkuTsxZN7BJKvshPg9xrrtf5VAsqVtsPteJovsJMyrkTest0gz8Bl0IetauRVqrw3ThzKwaLmHvhXpGBUsiYAD73o1rKsg28cYboRMp2wE1AnEyhDcIxHPlg4uWQuYmTce5zxO6HFoPG-cXQEbr4Ld_xkjLGxckipJH4wKGUFiJMa0JiR_o1Fob7GjdxRSRRs2Hy15APIOeGiuUYy6DYjZxX_07DgBWoRZJo7xZVS5AUscSOseaI">
<!-- Top HUD Elements -->
<div class="absolute top-0 left-0 w-full p-margin-mobile flex justify-between items-start z-10 bg-gradient-to-b from-surface-container-lowest/80 to-transparent">
<button class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-xl border border-white/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="bg-surface-container/60 backdrop-blur-xl border border-white/10 rounded-full px-4 py-1 flex items-center gap-2 shadow-[0_0_15px_rgba(173,198,255,0.1)]">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="timer">timer</span>
<span class="font-mono-timer text-mono-timer text-secondary">00:45</span>
</div>
</div>
<!-- Simplifed Driving HUD (Overlay) -->
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end z-10">
<!-- Speedometer simplified -->
<div class="hud-border p-2 bg-surface-container-low/80 backdrop-blur-md rounded-DEFAULT">
<div class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter">45<span class="text-label-caps font-label-caps text-on-surface-variant ml-1">km/h</span></div>
</div>
<!-- Gear/Status -->
<div class="hud-border p-2 bg-surface-container-low/80 backdrop-blur-md rounded-DEFAULT flex gap-2">
<div class="w-8 h-8 rounded-DEFAULT bg-secondary-container/20 flex items-center justify-center border border-secondary/30">
<span class="font-headline-sm text-headline-sm text-secondary font-bold">D</span>
</div>
<div class="w-8 h-8 rounded-DEFAULT bg-surface-container flex items-center justify-center border border-white/10">
<span class="font-headline-sm text-headline-sm text-on-surface-variant">R</span>
</div>
</div>
</div>
</div>
<!-- Question Area -->
<div class="flex-1 p-margin-mobile flex flex-col gap-stack-lg bg-background">
<!-- Header -->
<div>
<div class="flex items-center gap-2 mb-stack-sm">
<span class="px-2 py-0.5 rounded-full bg-primary-container/20 text-primary font-label-caps text-label-caps border border-primary/30">Scenario #402</span>
<span class="px-2 py-0.5 rounded-full bg-error-container/20 text-error font-label-caps text-label-caps border border-error/30">Hard</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Intersection Yielding</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">You are approaching an uncontrolled intersection. A vehicle is approaching from your right. What is the correct action?</p>
</div>
<!-- Answers (1 Column) -->
<div class="flex flex-col gap-stack-sm w-full mt-auto mb-stack-lg">
<button class="w-full text-left p-4 rounded-lg bg-surface-container border border-white/10 hover:border-primary/50 transition-colors duration-200 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/0 to-primary/0 group-hover:from-primary/5 group-hover:to-transparent transition-all"></div>
<div class="flex items-start gap-3 relative z-10">
<div class="w-6 h-6 rounded-full border border-outline-variant flex-shrink-0 mt-0.5 flex items-center justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">A</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Maintain speed, you have the right of way.</span>
</div>
</button>
<!-- Active/Selected State -->
<button class="w-full text-left p-4 rounded-lg bg-primary-container/10 border border-primary hud-glow transition-colors duration-200 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/10 to-transparent"></div>
<div class="flex items-start gap-3 relative z-10">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex-shrink-0 mt-0.5 flex items-center justify-center shadow-[0_0_10px_rgba(173,198,255,0.6)]">
<span class="font-label-caps text-label-caps">B</span>
</div>
<span class="font-body-md text-body-md text-primary font-medium">Yield to the vehicle approaching from the right.</span>
</div>
</button>
<button class="w-full text-left p-4 rounded-lg bg-surface-container border border-white/10 hover:border-primary/50 transition-colors duration-200 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/0 to-primary/0 group-hover:from-primary/5 group-hover:to-transparent transition-all"></div>
<div class="flex items-start gap-3 relative z-10">
<div class="w-6 h-6 rounded-full border border-outline-variant flex-shrink-0 mt-0.5 flex items-center justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">C</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Sound horn and proceed immediately.</span>
</div>
</button>
<button class="w-full text-left p-4 rounded-lg bg-surface-container border border-white/10 hover:border-primary/50 transition-colors duration-200 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/0 to-primary/0 group-hover:from-primary/5 group-hover:to-transparent transition-all"></div>
<div class="flex items-start gap-3 relative z-10">
<div class="w-6 h-6 rounded-full border border-outline-variant flex-shrink-0 mt-0.5 flex items-center justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">D</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Accelerate to clear the intersection quickly.</span>
</div>
</button>
</div>
<!-- Submit Button -->
<button class="w-full py-4 rounded-lg bg-gradient-to-r from-primary to-secondary text-on-primary-fixed font-headline-sm text-headline-sm hover:scale-[1.02] active:scale-95 transition-all duration-200 hud-glow shadow-lg mb-8">
            Confirm Action
        </button>
</div>
</body></html>
