        .hud-bracket::before {
            content: '';

            border-top: 2px solid theme('colors.secondary');
            border-left: 2px solid theme('colors.secondary');

        .hud-bracket::after {
            content: '';

            border-right: 2px solid theme('colors.secondary');

<!-- Logic for Timer (Simulating transition to < 2 mins) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerEl = document.getElementById('examTimer');
            const timerText = document.getElementById('timerText');
            
            // Start at 2 minutes and 5 seconds to show the transition quickly
            let totalSeconds = 125; 

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const updateTimer = () => {
                if (totalSeconds <= 0) {
                    clearInterval(interval);
                    timerText.innerText = "00:00";
                    return;
                }
                
                totalSeconds--;
                timerText.innerText = formatTime(totalSeconds);

                // If less than 2 minutes (120 seconds), trigger warning state
                if (totalSeconds < 120 && !timerEl.classList.contains('timer-warning')) {
                    timerEl.classList.remove('timer-normal');
                    timerEl.classList.add('timer-warning');
                }
            };

            const interval = setInterval(updateTimer, 1000);
        });
    </script>
